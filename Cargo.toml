[workspace]
members = [
    "crates/core",
    "crates/gguf-bridge",
    "crates/hw-probe",
    "crates/cli",
    "crates/py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Staff Systems & ML Infrastructure Engineer"]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"
half = { version = "2.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
libloading = "0.8"
pyo3 = { version = "0.23", features = ["extension-module"] }
